name: Weekly Bias Board

on:
  schedule:
    - cron: "0 7 * * 6"        # Saturday 07:00 UTC, after the Friday COT release (records the live verdicts)
    - cron: "30 22 * * 1-5"    # Mon-Fri 22:30 UTC, after the US close: fresh prices, room left, windows, macro
  push:
    branches: [main]           # every push rebuilds and redeploys the site
  workflow_dispatch:
    inputs:
      outlook_date:
        description: "Report date YYYY-MM-DD (empty = today)"
        required: false

permissions:
  contents: write              # the Saturday run commits the live record (data/track/verdicts.json)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - name: Restore the last pulled data
        uses: actions/cache/restore@v4
        with:
          path: data/live
          key: lse-data-${{ github.run_id }}
          restore-keys: lse-data-
      - name: Pull COT and prices from LSE
        id: pull
        continue-on-error: true      # an LSE outage falls back to the last saved data instead of stopping the build
        env:
          LSE_KEY: ${{ secrets.LSE_KEY }}
        run: python bias/pull.py
      - name: Save the pulled data for the next run
        if: steps.pull.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/live
          key: lse-data-${{ github.run_id }}
      - name: Build outlook and app
        if: steps.pull.outcome == 'success' || hashFiles('data/live/cot.json') != ''
        env:
          DATA_STALE: ${{ steps.pull.outcome != 'success' && '1' || '' }}
          OUTLOOK_DATE: ${{ github.event.inputs.outlook_date }}
          TRACK: ${{ github.event.schedule == '0 7 * * 6' && steps.pull.outcome == 'success' && '1' || '' }}   # record verdicts only on the Saturday run
        run: |
          python bias/build.py
          python bias/app.py
      - name: Save the live record
        if: github.event.schedule == '0 7 * * 6' && steps.pull.outcome == 'success'
        run: |
          git config user.name "bias-board"
          git config user.email "bias-board@users.noreply.github.com"
          git add data/track/verdicts.json
          git diff --cached --quiet || (git commit -m "Live record: verdicts of $(date -u +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
