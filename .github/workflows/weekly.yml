name: Weekly Bias Board

on:
  schedule:
    - cron: "0 7 * * 6"        # Saturday 07:00 UTC, after the Friday COT release
  workflow_dispatch:
    inputs:
      outlook_date:
        description: "Report date YYYY-MM-DD (empty = today)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - name: Pull COT and prices from LSE
        env:
          LSE_KEY: ${{ secrets.LSE_KEY }}
        run: python bias/pull.py
      - name: Build outlook and app
        env:
          OUTLOOK_DATE: ${{ github.event.inputs.outlook_date }}
        run: |
          python bias/build.py
          python bias/app.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
